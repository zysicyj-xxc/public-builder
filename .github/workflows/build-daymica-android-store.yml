# daymica 国内商店包，仅 workflow_dispatch。不登记版本、不上传对象存储、不打 tag、不发 GitHub Release、不碰 CNB。
# flavor 以权限 PR 合入后的为准（私仓 fix/daymica-store-flavor-no-install-perm）。
# 合入后脚本把 app-store-release.apk 复制为 daymica-store-v<Version>+<BuildNumber>.apk；本工作流只上传该文件，路径限制在 apps/daymica 下。
# keystore 由脚本解到临时目录并在 finally 删除，这里不写 jks。
# Trust boundary: workflow_dispatch inputs are untrusted until allowlisted.
# upload-artifact@v4 与 actions/cache 使用 runtime token。staging 在仅 contents:read 下已上传成功；
# GitHub workflow syntax 把 actions:write 举例为取消 workflow run，未要求上传 artifact。本 job 只继承 contents: read。

name: Daymica Android Store

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref of zysicyj-xxc/zysicyj (default main)'
        required: false
        default: main
        type: string
      sha:
        description: 'Commit SHA (optional; wins over ref)'
        required: false
        type: string
      version:
        description: 'Version for -Version'
        required: true
        type: string
      build:
        description: 'Build number for -BuildNumber (digits)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daymica-android-store
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  daymica-android-store:
    name: daymica-android-store
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Allowlist ref/sha
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ inputs.ref }}
          sha: ${{ inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Allowlist version/build
        id: ver
        env:
          RAW_VERSION: ${{ inputs.version }}
          RAW_BUILD: ${{ inputs.build }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Match([string]$name, [string]$value, [string]$pattern) {
            if ([string]::IsNullOrWhiteSpace($value)) { throw "$name is empty" }
            if ($value -notmatch $pattern) { throw "$name failed allowlist" }
          }
          Assert-Match 'version' $env:RAW_VERSION.Trim() '^[A-Za-z0-9._-]{1,64}$'
          Assert-Match 'build' $env:RAW_BUILD.Trim() '^[0-9]{1,16}$'
          "version=$($env:RAW_VERSION.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build=$($env:RAW_BUILD.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Cache shared Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: Linux-gradle-shared-v2
          restore-keys: |
            Linux-gradle-shared-

      - name: Cache dart_tool
        uses: actions/cache@v4
        with:
          path: |
            apps/daymica/.dart_tool
            apps/shared_package/.dart_tool
          key: ${{ runner.os }}-darttool-daymica-${{ hashFiles('apps/daymica/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-darttool-daymica-

      - name: build
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          APP_BUILD: ${{ steps.ver.outputs.build }}
          DAYMICA_ANDROID_KEYSTORE_BASE64: ${{ secrets.DAYMICA_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APP_VERSION -notmatch '^[A-Za-z0-9._-]{1,64}$') { throw 'invalid APP_VERSION' }
          if ($env:APP_BUILD -notmatch '^[0-9]{1,16}$') { throw 'invalid APP_BUILD' }
          if ([string]::IsNullOrWhiteSpace($env:DAYMICA_ANDROID_KEYSTORE_BASE64)) { throw 'DAYMICA_ANDROID_KEYSTORE_BASE64 secret missing' }
          if ([string]::IsNullOrWhiteSpace($env:KEY_PASSWORD)) { throw 'KEY_PASSWORD secret missing' }
          if ([string]::IsNullOrWhiteSpace($env:STORE_PASSWORD)) { throw 'STORE_PASSWORD secret missing' }
          if ([string]::IsNullOrWhiteSpace($env:KEY_ALIAS)) { $env:KEY_ALIAS = 'daymica' }
          & ./scripts/build-daymica-android-store-prod.ps1 -Version $env:APP_VERSION -BuildNumber ([int]$env:APP_BUILD)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: upload store APK
        uses: actions/upload-artifact@v4
        with:
          name: daymica-store-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.build }}
          path: apps/daymica/**/daymica-store-v${{ steps.ver.outputs.version }}+${{ steps.ver.outputs.build }}.apk
          retention-days: 3
          if-no-files-found: error
