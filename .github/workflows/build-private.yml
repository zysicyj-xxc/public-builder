# Backend + web builds only (non-platform jobs).
# Android -> build-private-android.yml; Windows -> build-private-windows.yml.
# 三者独立 concurrency + 独立 release，互不影响。
# Trust boundary: only repository_dispatch; treat client_payload as untrusted.

name: Public Builder Backend & Web

on:
  repository_dispatch:
    types: [trigger-build]

permissions:
  contents: read

concurrency:
  group: pb-bw-${{ github.event.client_payload.mode }}-${{ github.event.client_payload.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: validate-payload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.v.outputs.ref }}
      mode: ${{ steps.v.outputs.mode }}
      jobs: ${{ steps.v.outputs.jobs }}
      daymica_version: ${{ steps.v.outputs.daymica_version }}
      daymica_build: ${{ steps.v.outputs.daymica_build }}
      yaoxiaobai_version: ${{ steps.v.outputs.yaoxiaobai_version }}
      yaoxiaobai_build: ${{ steps.v.outputs.yaoxiaobai_build }}
      footprint_version: ${{ steps.v.outputs.footprint_version }}
      footprint_build: ${{ steps.v.outputs.footprint_build }}
      backend_url: ${{ steps.v.outputs.backend_url }}
      newapp_version: ${{ steps.v.outputs.newapp_version }}
      newapp_build: ${{ steps.v.outputs.newapp_build }}
    steps:
      - name: Validate client_payload
        id: v
        env:
          RAW_REF: ${{ github.event.client_payload.ref }}
          RAW_MODE: ${{ github.event.client_payload.mode }}
          RAW_JOBS: ${{ github.event.client_payload.jobs }}
          RAW_DAYMICA: ${{ github.event.client_payload.daymica }}
          RAW_YAOXIAOBAI: ${{ github.event.client_payload.yaoxiaobai }}
          RAW_FOOTPRINT: ${{ github.event.client_payload.footprint }}
          RAW_NEWAPP: ${{ github.event.client_payload.newapp }}
          RAW_BACKEND_URL: ${{ github.event.client_payload.backend_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Out([string]$k, [string]$v) {
            "$k=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          function Assert-Match([string]$name, [string]$value, [string]$pattern) {
            if ([string]::IsNullOrWhiteSpace($value)) { throw "$name is empty" }
            if ($value -notmatch $pattern) { throw "$name failed allowlist: '$value'" }
            return $value
          }
          function Split-VerBuild([string]$name, [string]$value, [string]$vre, [string]$bre) {
            $t = if ($null -eq $value) { '' } else { $value.Trim() }
            if ([string]::IsNullOrWhiteSpace($t)) { return , @('0', '0') }
            $parts = $t -split '\+', 2
            $v = Assert-Match "${name}_version" $parts[0] $vre
            $b = if ($parts.Count -ge 2 -and $parts[1]) { Assert-Match "${name}_build" $parts[1] $bre } else { '0' }
            return , @($v, $b)
          }

          # 三路 workflow 都会收到同一 dispatch；本路无对应 app 时 soft-skip，勿把整次 run 标红
          $refPattern = '^refs/tags/(daymica|yaoxiaobai|footprint|backend|ai-usage|easy-shell|system-monitor|password-vault|clean-master|eye-care|issue-board|mail-box)/(?:[0-9]{12}|[0-9]{4}\.[0-9]{1,2}\.[0-9]+-[0-9]+)$'
          $rawRef = if ($null -eq $env:RAW_REF) { '' } else { $env:RAW_REF.Trim() }
          if ([string]::IsNullOrWhiteSpace($rawRef)) { throw 'ref is empty' }
          if ($rawRef -notmatch $refPattern) {
            Write-Host "ref not for backend/web workflow allowlist; skip: $rawRef"
            Out 'ref' $rawRef
            Out 'mode' 'release'
            Out 'jobs' ''
            exit 0
          }
          $ref = $rawRef
          $mode = Assert-Match 'mode' $env:RAW_MODE.Trim() '^release$'

          $allowedJobs = @(
            'daymica-web', 'backend'
          )
          $jobs = @()
          foreach ($j in ($env:RAW_JOBS -split ',')) {
            $t = $j.Trim()
            if (-not $t) { continue }
            if ($t -notin $allowedJobs) { continue }
            if ($t -notin $jobs) { $jobs += $t }
          }
          if ($jobs.Count -eq 0) {
            Write-Host 'No backend/web jobs in payload; skip'
            Out 'ref' $ref
            Out 'mode' $mode
            Out 'jobs' ''
            exit 0
          }

          $verRe = '^[A-Za-z0-9._-]{1,64}$'
          $buildRe = '^[0-9]{1,16}$'

          $d = Split-VerBuild 'daymica' $env:RAW_DAYMICA $verRe $buildRe; $dv = $d[0]; $db = $d[1]
          $y = Split-VerBuild 'yaoxiaobai' $env:RAW_YAOXIAOBAI $verRe $buildRe; $yv = $y[0]; $yb = $y[1]
          $f = Split-VerBuild 'footprint' $env:RAW_FOOTPRINT $verRe $buildRe; $fv = $f[0]; $fb = $f[1]
          $n = Split-VerBuild 'newapp' $env:RAW_NEWAPP $verRe $buildRe; $nv = $n[0]; $nb = $n[1]
          $backendUrl = Assert-Match 'backend_url' $env:RAW_BACKEND_URL.Trim() '^https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[^\s]*)?$'

          $jobsCsv = ',' + ($jobs -join ',') + ','

          Write-Host "OK ref=$ref mode=$mode jobs=$($jobs -join ',')"
          Out 'ref' $ref
          Out 'mode' $mode
          Out 'jobs' $jobsCsv
          Out 'daymica_version' $dv
          Out 'daymica_build' $db
          Out 'yaoxiaobai_version' $yv
          Out 'yaoxiaobai_build' $yb
          Out 'footprint_version' $fv
          Out 'footprint_build' $fb
          Out 'backend_url' $backendUrl
          Out 'newapp_version' $nv
          Out 'newapp_build' $nb

  daymica-web:
    name: daymica-web
    needs: validate
    if: ${{ contains(needs.validate.outputs.jobs, ',daymica-web,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.validate.outputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: Cache dart_tool
        uses: actions/cache@v4
        with:
          path: |
            apps/daymica/.dart_tool
            apps/shared_package/.dart_tool
          key: ${{ runner.os }}-web-daymica-${{ hashFiles('apps/daymica/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-web-daymica-
      - name: build+deploy
        env:
          APP_VERSION: ${{ needs.validate.outputs.daymica_version }}
          APP_BUILD: ${{ needs.validate.outputs.daymica_build }}
          DAYMICA_RELEASE_TOKEN: ${{ secrets.DAYMICA_RELEASE_TOKEN }}
          RUSTFS_ACCESS_KEY: ${{ secrets.DAYMICA_RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY: ${{ secrets.DAYMICA_RUSTFS_SECRET_KEY }}
          DAYMICA_RUSTFS_ACCESS_KEY: ${{ secrets.DAYMICA_RUSTFS_ACCESS_KEY }}
          DAYMICA_RUSTFS_SECRET_KEY: ${{ secrets.DAYMICA_RUSTFS_SECRET_KEY }}
          WEBHOOK_DEPLOY_KEY: ${{ secrets.WEBHOOK_DEPLOY_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APP_BUILD -notmatch '^[0-9]{1,16}$') { throw 'invalid APP_BUILD' }
          & ./scripts/deploy-daymica-web-static-prod.ps1 -Version $env:APP_VERSION -BuildNumber $env:APP_BUILD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  backend:
    name: backend
    needs: validate
    if: ${{ contains(needs.validate.outputs.jobs, ',backend,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.validate.outputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: build+deploy (native systemd)
        env:
          DAYMICA_RELEASE_TOKEN: ${{ secrets.DAYMICA_RELEASE_TOKEN }}
          DAYMICA_RUSTFS_ACCESS_KEY: ${{ secrets.DAYMICA_RUSTFS_ACCESS_KEY }}
          DAYMICA_RUSTFS_SECRET_KEY: ${{ secrets.DAYMICA_RUSTFS_SECRET_KEY }}
          RUSTFS_ACCESS_KEY: ${{ secrets.DAYMICA_RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY: ${{ secrets.DAYMICA_RUSTFS_SECRET_KEY }}
          WEBHOOK_DEPLOY_KEY: ${{ secrets.WEBHOOK_DEPLOY_KEY }}
          CONFIG_PROD_BASE64: ${{ secrets.CONFIG_PROD_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/deploy-backend-native-prod.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ---------------------------------------------------------------------------
  # Create GitHub Release after backend/web builds succeed (idempotent).
  # Artifacts live on RustFS; this release serves as version record + download index.
  # ---------------------------------------------------------------------------
  release:
    name: create-github-release
    needs: [validate, daymica-web, backend]
    if: ${{ always() && needs.validate.result == 'success' && needs.validate.outputs.jobs != '' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create Release on private repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          REF: ${{ needs.validate.outputs.ref }}
          JOBS: ${{ needs.validate.outputs.jobs }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tagName = $env:REF -replace '^refs/tags/', ''
          $app = ($tagName -split '/')[0]
          $ver = ($tagName -split '/', 2)[1] -replace '-[0-9]+$', ''
          $jobsList = $env:JOBS.Trim(',')

          # 幂等 + 合并：同 tag 可能被 android/windows 两个 workflow 并发创建。
          # 已存在时读取现有 notes，把本 workflow 的 jobs 合并进去（去重）后更新，
          # 保证最终 release notes 包含全部平台（如 windows 先创建、android 后合并）。
          $existing = gh release view $tagName --repo zysicyj-xxc/zysicyj 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = "## $app v$ver`n`n**Tag:** ``$tagName```n**Built jobs:** $jobsList`n`nDownloads are hosted on RustFS (https://rustfs.zysicyj.top)."
            gh release create $tagName --repo zysicyj-xxc/zysicyj --title "$app v$ver" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "Created release: $tagName"
          } else {
            $oldNotes = $existing.body
            $jobsLine = ($oldNotes -split "`n" | Where-Object { $_ -match '^\*\*Built jobs:\*\*' } | Select-Object -First 1)
            if ($jobsLine) {
              $oldJobs = @(($jobsLine -replace '^\*\*Built jobs:\*\*\s*', '') -split ', ' | Where-Object { $_ })
              $myJobs = @($jobsList -split ', ' | Where-Object { $_ })
              $merged = @($oldJobs + $myJobs | Select-Object -Unique) -join ', '
              $newNotes = $oldNotes -replace [regex]::Escape($jobsLine), "**Built jobs:** $merged"
            } else {
              $newNotes = $oldNotes + "`n`n**Built jobs:** $jobsList"
            }
            gh release edit $tagName --repo zysicyj-xxc/zysicyj --notes $newNotes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "Merged jobs into existing release: $tagName"
          }

  # 本平台全部 job（含 release）结束后发信。无 backend/web jobs 时不发。
  notify:
    name: Notify mail
    needs: [validate, daymica-web, backend, release]
    if: ${{ always() && (needs.validate.result == 'failure' || needs.validate.outputs.jobs != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Send mail
        continue-on-error: true
        uses: ./.github/actions/notify-mail
        with:
          workflow: public-builder-backend
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          ref: ${{ needs.validate.outputs.ref }}
          job_results: |
            validate: ${{ needs.validate.result }}
            daymica-web: ${{ needs.daymica-web.result }}
            backend: ${{ needs.backend.result }}
            release: ${{ needs.release.result }}
          note: ${{ contains(needs.*.result, 'failure') && 'Backend/Web 打包未全部成功，请打开 Run 查看失败 job。' || format('Backend/Web 打包已结束。jobs={0}', needs.validate.outputs.jobs) }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          auth_code: ${{ secrets.NOTIFY_MAIL_AUTH_CODE }}
          mail_from: ${{ secrets.NOTIFY_MAIL_FROM }}
          mail_to: ${{ secrets.NOTIFY_MAIL_TO }}
          github_token: ${{ github.token }}
          release_token: ${{ secrets.DAYMICA_RELEASE_TOKEN }}
          api_base: ${{ needs.validate.outputs.backend_url }}
