# Temporary: read staging script parameters. Not part of the final workflow.
name: Staging Builds

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    name: inspect-staging-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Allowlist ref
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: main
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ steps.resolve.outputs.sha }}
          path: private
          persist-credentials: false
          fetch-depth: 1

      - name: Print parameter interface
        working-directory: private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path('.')
          scripts = sorted(root.glob('scripts/**/*.ps1'))
          print('script_count', len(scripts))
          key = re.compile(r'staging|Channel|Upload|Skip|releases|AppSlug|keystore|Debug|applicationId|version|RustFS|param\b', re.I)
          secretish = re.compile(r'(password|secret|token|keystore)\s*=\s*["\'][^"\']+["\']', re.I)
          for p in scripts:
              text = p.read_text(encoding='utf-8', errors='replace')
              if not re.search(r'staging|\$Channel|\[string\]\$Channel|-Channel', text, re.I):
                  continue
              print('FILE', p.as_posix(), 'lines', text.count('\n') + 1)
              lines = text.splitlines()
              # param block only, plus keyword lines outside it
              start = None
              for i, line in enumerate(lines):
                  if start is None and re.match(r'\s*param\s*\(', line):
                      start = i
                  if start is not None:
                      if secretish.search(line):
                          print(f'{i+1}: <redacted>')
                      else:
                          print(f'{i+1}: {line[:300]}')
                      if i > start and line.strip() == ')':
                          break
              for i, line in enumerate(lines):
                  if not key.search(line):
                      continue
                  if secretish.search(line):
                      print(f'K {i+1}: <redacted>')
                      continue
                  print(f'K {i+1}: {line[:300]}')
          print('--- gradle staging lines ---')
          for p in root.glob('apps/**/*'):
              if p.suffix not in {'.kts', '.xml', '.gradle', '.properties'} or not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  continue
              if 'staging' not in text.lower() and 'app_name_staging' not in text:
                  continue
              rel = p.as_posix()
              if not rel.startswith('apps/daymica/') and not rel.startswith('apps/password-vault/'):
                  continue
              print('GRADLE', rel)
              for i, line in enumerate(text.splitlines(), 1):
                  if re.search(r'staging|applicationId|app_name', line, re.I):
                      print(f'{i}: {line[:300]}')
          PY
