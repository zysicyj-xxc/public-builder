# Flutter tests for the small apps on zysicyj-xxc/zysicyj.
# mail-box, shared_package, footprint, eye-care, admin-app, and water-tracker
# run on every dispatch. There is no path filter.
# only=mail-box,footprint limits the run to those apps. Empty runs all.
# Trust boundary: repository_dispatch (visual-lint, kept for compatibility)
# and workflow_dispatch only. No pull_request.
# Status contexts: flutter-test (<app>).

name: Flutter Test

on:
  repository_dispatch:
    types: [visual-lint]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: true
        type: string
      sha:
        description: 'Commit SHA for checkout and status (default: resolve ref)'
        required: false
        type: string
      only:
        description: 'Comma list of apps. Empty runs mail-box, shared_package, footprint, eye-care, admin-app, water-tracker.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: flutter-test-${{ github.event.client_payload.sha || github.event.inputs.sha || github.event.client_payload.ref || github.event.inputs.ref }}-${{ github.event.inputs.only || github.event.client_payload.only || 'all' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: resolve-payload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      include: ${{ steps.pick.outputs.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Self-check path matcher
        run: bash .github/scripts/flutter_test_paths.sh --selftest

      - name: Allowlist ref/sha
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
          sha: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Pick apps
        id: pick
        env:
          RAW: ${{ github.event.client_payload.only || github.event.inputs.only }}
        run: |
          set -euo pipefail
          python3 - "$RAW" <<'PY'
          import json, os, sys
          dirs = {
              "mail-box": "apps/mail-box",
              "shared_package": "apps/shared_package",
              "footprint": "apps/footprint",
              "eye-care": "apps/eye-care",
              "admin-app": "apps/admin-app",
              "water-tracker": "apps/water-tracker",
          }
          raw = (sys.argv[1] or "").replace(" ", "")
          if raw == "":
              apps = list(dirs)
          else:
              apps = []
              for part in raw.split(","):
                  if not part:
                      continue
                  if part not in dirs:
                      sys.exit("FAIL apps")
                  if part not in apps:
                      apps.append(part)
              if not apps:
                  sys.exit("FAIL apps")
          include = [{"app": app, "dir": dirs[app]} for app in apps]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("include=" + json.dumps(include, separators=(",", ":")) + "\n")
          print("PASS apps count=" + str(len(apps)))
          PY

      - name: Set pending statuses
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          INCLUDE: ${{ steps.pick.outputs.include }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "FAIL sha" >&2
            exit 1
          fi
          python3 - "$INCLUDE" <<'PY'
          import json, os, subprocess, sys
          include = json.loads(sys.argv[1])
          sha = os.environ["SHA"]
          url = os.environ["RUN_URL"]
          for item in include:
              ctx = "flutter-test (" + item["app"] + ")"
              subprocess.check_call([
                  "gh", "api", "--method", "POST",
                  f"repos/zysicyj-xxc/zysicyj/statuses/{sha}",
                  "-f", "state=pending",
                  "-f", f"target_url={url}",
                  "-f", "description=running",
                  "-f", f"context={ctx}",
              ], stdout=subprocess.DEVNULL)
          print("PASS pending count=" + str(len(include)))
          PY

  test:
    name: flutter-test (${{ matrix.app }})
    needs: meta
    if: needs.meta.outputs.include != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - name: Read Flutter version
        id: flutter
        run: |
          set -euo pipefail
          if [ ! -f .flutter-version ]; then
            echo "FAIL flutter-version" >&2
            exit 1
          fi
          ver=$(tr -d '[:space:]' < .flutter-version)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL flutter-version" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.dir)) }}
          restore-keys: |
            pub-${{ runner.os }}-${{ matrix.app }}-
      - name: flutter pub get and test
        env:
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: ${{ matrix.app }}
          QUIET_KIND: flutter-test
          QUIET_DIR: ${{ matrix.dir }}
          QUIET_CMD: 'cd "$QUIET_DIR" && flutter pub get && flutter test --concurrency=2 --reporter json'
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  report:
    name: post-statuses
    needs: [meta, test]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Post conclusions
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          INCLUDE: ${{ needs.meta.outputs.include }}
          ACTIONS_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "FAIL sha" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os, subprocess, time
          include = json.loads(os.environ["INCLUDE"])
          contexts = ["flutter-test (" + item["app"] + ")" for item in include]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          sha = os.environ["SHA"]
          url = os.environ["RUN_URL"]
          env = dict(os.environ)
          env["GH_TOKEN"] = os.environ["ACTIONS_TOKEN"]
          found = {}
          for _ in range(6):
              raw = subprocess.check_output([
                  "gh", "api", "--paginate",
                  f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100",
                  "--jq", ".jobs[] | [.name, (.conclusion // \"\")] | @tsv",
              ], env=env, text=True)
              found = {}
              for line in raw.splitlines():
                  name, _, conclusion = line.partition("\t")
                  found[name] = conclusion
              if all(ctx in found for ctx in contexts):
                  break
              time.sleep(5)
          env["GH_TOKEN"] = os.environ["STATUS_TOKEN"]
          for ctx in contexts:
              conclusion = found.get(ctx, "")
              if conclusion == "success":
                  state, desc = "success", "success"
              elif conclusion == "cancelled":
                  state, desc = "failure", "cancelled"
              else:
                  state, desc = "failure", "failure"
              print("status " + state)
              subprocess.check_call([
                  "gh", "api", "--method", "POST",
                  f"repos/zysicyj-xxc/zysicyj/statuses/{sha}",
                  "-f", f"state={state}",
                  "-f", f"target_url={url}",
                  "-f", f"description={desc}",
                  "-f", f"context={ctx}",
              ], env=env, stdout=subprocess.DEVNULL)
          PY

  purge-logs:
    name: schedule-log-purge
    needs: [meta, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Request log purge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: bash .github/scripts/request-purge.sh || echo "FAIL purge-request"
