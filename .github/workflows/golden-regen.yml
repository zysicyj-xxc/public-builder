# Regenerate apps/shared_package golden PNGs for zysicyj-xxc/zysicyj.
# Manual only. Does not post a commit status and does not push.
# Trust boundary: the workflow_dispatch ref is untrusted until resolve-private-ref allowlists it.
# Flutter 3.44.8 matches visual-lint golden-tests and i18n-gate.
# Public logs list changed golden paths only. Flutter output is discarded so a
# secret, DSN, hostname, or private file body cannot land in the log.
# retention-days is 1 because any logged-in user can download a public-repo artifact.

name: Golden Regen

on:
  # Temporary diagnosis trigger. Removed after the failure list is known.
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: false
        default: main
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: golden-regen-${{ github.event.inputs.ref || 'main' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  regen:
    name: regen-goldens
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Allowlist ref
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Update goldens
        id: update
        run: |
          set -euo pipefail
          if [ ! -f apps/shared_package/pubspec.yaml ]; then
            echo "ERROR: missing apps/shared_package/pubspec.yaml" >&2
            exit 1
          fi
          pub_log="${RUNNER_TEMP}/flutter-pub-get.log"
          test_log="${RUNNER_TEMP}/flutter-test.log"
          pub_rc=0
          test_rc=0
          (
            cd apps/shared_package
            flutter pub get >"$pub_log" 2>&1
          ) || pub_rc=$?
          if [ "$pub_rc" -eq 0 ]; then
            (
              cd apps/shared_package
              flutter test --update-goldens >"$test_log" 2>&1
            ) || test_rc=$?
          else
            test_rc=1
          fi
          echo "pub_rc=${pub_rc} test_rc=${test_rc}"
          # Temporary: failed-test names and the first lines of each exception.
          python3 - "$test_log" <<'PY'
          import re
          import sys

          def redact(line):
              if re.search(
                  r"(?i)(\btoken\b|\bpassword\b|\bsecret\b|authorization|"
                  r"(?:postgres|postgresql|mysql|mongodb|redis|amqp)://|"
                  r"\b(?:server|data source|user id)\s*=)",
                  line,
              ):
                  return "[REDACTED]"
              return line

          path = sys.argv[1]
          try:
              raw = open(path, errors="replace").read()
          except OSError:
              print("no flutter log")
              raise SystemExit(0)
          raw = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", raw)
          lines = [ln.rstrip() for ln in raw.splitlines()]

          def emit(kind, text):
              text = redact(text.strip())
              if len(text) > 220:
                  text = text[:220]
              print(f"{kind} {text}")

          seen_fail = set()
          for i, line in enumerate(lines):
              name = ""
              if line.strip().startswith("The test description was:"):
                  name = line.split(":", 1)[1].strip()
                  if not name:
                      for nxt in lines[i + 1 : i + 4]:
                          nxt = nxt.strip()
                          if nxt and not nxt.startswith("##[") and not nxt.startswith("✅"):
                              name = nxt
                              break
              elif re.search(r"\[E\]\s*$", line):
                  name = re.sub(r"^\d+:\d+\s+\+\d+\s+-\d+:\s*", "", line.strip())
                  name = re.sub(r"\s+\[E\]\s*$", "", name)
              if name and name not in seen_fail:
                  seen_fail.add(name)
                  emit("FAIL", name)

          seen_exc = set()
          i = 0
          while i < len(lines):
              line = lines[i].strip()
              kind = ""
              if line.startswith("The following ") and " was thrown" in line:
                  kind = line
              elif line.startswith("The following message was thrown"):
                  kind = line
              if not kind:
                  i += 1
                  continue
              message = ""
              frame = ""
              for nxt in lines[i + 1 : i + 16]:
                  text = nxt.strip()
                  if not text or text.startswith("##[") or text.startswith("══"):
                      continue
                  if text.startswith("#") or text.startswith("package:") or " (" in text and ".dart" in text:
                      if not frame:
                          frame = text
                      break
                  if text.startswith("When the exception was thrown"):
                      continue
                  if not message:
                      message = text
              key = (kind, message, frame)
              if key not in seen_exc:
                  seen_exc.add(key)
                  emit("EXC", kind)
                  emit("MSG", message or "(no message)")
                  emit("FRAME", frame or "(no frame)")
              i += 1
          print(f"fail_count={len(seen_fail)} exc_count={len(seen_exc)}")
          PY

          pack="${RUNNER_TEMP}/golden-pack"
          rm -rf "$pack"
          mkdir -p "$pack"
          list="${pack}/changed-files.txt"
          : >"$list"
          while IFS= read -r -d '' rec; do
            [ -n "$rec" ] || continue
            xy="${rec:0:2}"
            path="${rec:3}"
            x="${xy:0:1}"
            case "$x" in
              R|C)
                # -z rename/copy is "XY <new>\0<old>\0". Keep the new path.
                IFS= read -r -d '' other || true
                if [ ! -f "$path" ] && [ -n "${other:-}" ]; then
                  path="$other"
                fi
                ;;
            esac
            case "$path" in
              ''|/*|../*|*/../*|*/..) continue ;;
              apps/shared_package/*) ;;
              *) continue ;;
            esac
            y="${xy:1:1}"
            keep=0
            case "$x" in
              M|A|'?'|R|C|T) keep=1 ;;
            esac
            case "$y" in
              M|A|'?'|R|C|T) keep=1 ;;
            esac
            [ "$keep" -eq 1 ] || continue
            [ -f "$path" ] || continue
            low=$(printf '%s' "$path" | tr '[:upper:]' '[:lower:]')
            case "$low" in
              *.png) ;;
              *) continue ;;
            esac
            case "$low" in
              *golden*) ;;
              *) continue ;;
            esac
            dest="${pack}/${path}"
            mkdir -p "$(dirname "$dest")"
            cp -- "$path" "$dest"
            printf '%s\n' "$path" >>"$list"
          done < <(git status --porcelain=v1 --untracked-files=all -z)

          if [ -s "$list" ]; then
            sort -u "$list" -o "${list}.sorted"
            mv "${list}.sorted" "$list"
            cat "$list"
          else
            echo "(none)"
          fi
          {
            echo "pub_rc=${pub_rc}"
            echo "test_rc=${test_rc}"
          } >>"$GITHUB_OUTPUT"

      - name: Upload golden pngs
        uses: actions/upload-artifact@v4
        with:
          name: shared-package-goldens
          path: ${{ runner.temp }}/golden-pack
          retention-days: 1
          if-no-files-found: error

      - name: Fail when flutter did not succeed
        if: steps.update.outputs.pub_rc != '0' || steps.update.outputs.test_rc != '0'
        run: |
          echo "flutter command failed"
          exit 1
