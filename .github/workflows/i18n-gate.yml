# l10n gate for zysicyj-xxc/zysicyj.
# Trust boundary: repository_dispatch client_payload and workflow_dispatch inputs are untrusted.
# Allowlist ref/sha before any API call. Status posts run in a separate job so
# PRIVATE_REPO_ACCESS_TOKEN is not on the runner that executes private-repo code.
#
# One job per package posts its own i18n-gate (<app>) status. The job runs
# `flutter pub get` then `flutter test --no-pub test/l10n` in that package.
# A package with no test/l10n is skipped. This workflow does not call
# scripts/ci-verify-l10n-gates.ps1 (local and pre-push still do).
# Fresh checkouts have no package_config, so pub get runs before flutter test.
# Flutter version comes from the private repo .flutter-version.

name: i18n Gate

on:
  repository_dispatch:
    types: [i18n-gate]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: true
        type: string
      sha:
        description: 'Commit SHA for checkout and status (default: resolve ref)'
        required: false
        type: string
      apps:
        description: 'Comma list of apps. Empty runs every i18n package.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: i18n-gate-${{ github.event.client_payload.sha || github.event.inputs.sha || github.event.client_payload.ref || github.event.inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: resolve-payload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      run_apps: ${{ steps.pick.outputs.run_apps }}
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Allowlist ref/sha
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
          sha: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Pick apps
        id: pick
        env:
          RAW: ${{ github.event.client_payload.apps || github.event.inputs.apps }}
        run: |
          set -euo pipefail
          python3 - "$RAW" <<'PY'
          import os, sys
          order = [
              "daymica", "mail-box", "password-vault", "yaoxiaobai", "eye-care",
              "footprint", "water-tracker", "admin-app", "shared_package",
          ]
          raw = (sys.argv[1] or "").replace(" ", "")
          if raw == "":
              apps = order
          else:
              apps = []
              for part in raw.split(","):
                  if not part:
                      continue
                  if part not in order:
                      sys.exit("FAIL apps")
                  if part not in apps:
                      apps.append(part)
              if not apps:
                  sys.exit("FAIL apps")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("run_apps= " + " ".join(apps) + " \n")
          print("PASS apps count=" + str(len(apps)))
          PY

      - name: Set pending statuses
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          RUN_APPS: ${{ steps.pick.outputs.run_apps }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          post() {
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="pending" \
              -f target_url="${RUN_URL}" \
              -f description="running" \
              -f context="$1" >/dev/null
          }
          for app in ${RUN_APPS}; do
            case "$app" in
              daymica|mail-box|password-vault|yaoxiaobai|eye-care|footprint|water-tracker|admin-app|shared_package)
                post "i18n-gate (${app})"
                ;;
              *) echo "FAIL apps" >&2; exit 1 ;;
            esac
          done
          echo "PASS pending"

      - name: Post failure when resolve fails
        if: failure()
        env:
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          RAW_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha=$(printf '%s' "${RESOLVED_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=$(printf '%s' "${RAW_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "no allowlisted sha; dispatcher pending left in place"
            exit 0
          fi
          for ctx in \
            "i18n-gate (daymica)" \
            "i18n-gate (mail-box)" \
            "i18n-gate (password-vault)" \
            "i18n-gate (yaoxiaobai)" \
            "i18n-gate (eye-care)" \
            "i18n-gate (footprint)" \
            "i18n-gate (water-tracker)" \
            "i18n-gate (admin-app)" \
            "i18n-gate (shared_package)"
          do
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${sha}" \
              -f state="failure" \
              -f target_url="${RUN_URL}" \
              -f description="payload rejected" \
              -f context="${ctx}" >/dev/null
          done

  verify:
    name: i18n-gate (${{ matrix.app }})
    needs: meta
    if: contains(needs.meta.outputs.run_apps, format(' {0} ', matrix.app))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: daymica
            dir: apps/daymica
          - app: mail-box
            dir: apps/mail-box
          - app: password-vault
            dir: apps/password-vault
          - app: yaoxiaobai
            dir: apps/yaoxiaobai/yaoxiaobai_app
          - app: eye-care
            dir: apps/eye-care
          - app: footprint
            dir: apps/footprint
          - app: water-tracker
            dir: apps/water-tracker
          - app: admin-app
            dir: apps/admin-app
          - app: shared_package
            dir: apps/shared_package
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Detect test/l10n
        id: detect
        env:
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          if [ -e "${DIR}/test/l10n" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "skipped: no test/l10n"
        if: steps.detect.outputs.present != 'true'
        run: |
          echo "skipped: no test/l10n"

      - name: Read Flutter version
        id: flutter
        if: steps.detect.outputs.present == 'true'
        run: |
          set -euo pipefail
          if [ ! -f .flutter-version ]; then
            echo "ERROR: missing .flutter-version" >&2
            exit 1
          fi
          ver=$(tr -d '[:space:]' < .flutter-version)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: .flutter-version is not X.Y.Z" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "flutter-version=$ver"

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.present == 'true'
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: 'stable'
          cache: true

      - uses: actions/checkout@v4
        if: steps.detect.outputs.present == 'true'
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/cache@v4
        if: steps.detect.outputs.present == 'true'
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-i18n-${{ matrix.app }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.dir)) }}
          restore-keys: |
            pub-${{ runner.os }}-i18n-${{ matrix.app }}-

      - name: l10n gates
        if: steps.detect.outputs.present == 'true'
        env:
          DIR: ${{ matrix.dir }}
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: ${{ matrix.app }}
          QUIET_KIND: flutter-test
          QUIET_CMD: 'cd "$DIR" && flutter pub get && flutter test --concurrency=2 --reporter json --no-pub test/l10n'
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"

      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-i18n-${{ strategy.job-index }}
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  report:
    name: post-statuses
    needs: [meta, verify]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post conclusions
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          ACTIONS_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_APPS: ${{ needs.meta.outputs.run_apps }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          declare -A conc=()
          declare -A detail=()
          contexts=()
          for app in ${RUN_APPS}; do
            case "$app" in
              daymica|mail-box|password-vault|yaoxiaobai|eye-care|footprint|water-tracker|admin-app|shared_package)
                contexts+=("i18n-gate (${app})")
                ;;
              *) echo "FAIL apps" >&2; exit 1 ;;
            esac
          done
          for attempt in 1 2 3 4 5 6; do
            conc=()
            detail=()
            while IFS=$'\t' read -r name conclusion skipped; do
              [ -n "$name" ] || continue
              conc["$name"]=$conclusion
              detail["$name"]=$skipped
            done < <(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | [.name, (.conclusion // ""), (if ((.steps // []) | any(.name == "skipped: no test/l10n" and .conclusion == "success")) then "skipped" else "" end)] | @tsv')
            missing=0
            for ctx in "${contexts[@]}"; do
              if [ -z "${conc[$ctx]:-}" ]; then
                missing=1
                echo "waiting for ${ctx} (attempt ${attempt})"
              fi
            done
            if [ "$missing" -eq 0 ]; then
              break
            fi
            sleep 5
          done
          for name in "${!conc[@]}"; do
            echo "job ${name} => ${conc[$name]}"
          done
          post() {
            local ctx="$1" conclusion="${2:-}" skipped="${3:-}" state desc
            case "$conclusion" in
              success)
                state=success
                if [ "$skipped" = "skipped" ]; then
                  desc="skipped: no test/l10n"
                else
                  desc=success
                fi
                ;;
              cancelled) state=failure; desc=cancelled ;;
              *) state=failure; desc=failure ;;
            esac
            echo "status ${ctx} ${state} ${desc}"
            GH_TOKEN="$STATUS_TOKEN" gh api --method POST \
              "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="$state" \
              -f target_url="${RUN_URL}" \
              -f description="$desc" \
              -f context="$ctx" >/dev/null
          }
          for ctx in "${contexts[@]}"; do
            post "$ctx" "${conc[$ctx]:-}" "${detail[$ctx]:-}"
          done

  purge-logs:
    name: schedule-log-purge
    needs: [meta, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Request log purge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: bash .github/scripts/request-purge.sh || echo "FAIL purge-request"
