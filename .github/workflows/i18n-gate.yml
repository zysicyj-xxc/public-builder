# l10n gate for zysicyj-xxc/zysicyj.
# Trust boundary: repository_dispatch client_payload and workflow_dispatch inputs are untrusted.
# Allowlist ref/sha before any API call. Status posts run in a separate job so
# PRIVATE_REPO_ACCESS_TOKEN is not on the runner that executes private-repo code.
#
# The private script is one process (scripts/ci-verify-l10n-gates.ps1). Each
# i18n-gate (<app>) context mirrors that single exit code.
# Flutter 3.44.8 is on PATH in case the script shells out to flutter.

name: i18n Gate

on:
  pull_request:
  repository_dispatch:
    types: [i18n-gate]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: true
        type: string
      sha:
        description: 'Commit SHA for checkout and status (default: resolve ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: i18n-gate-${{ github.event.client_payload.sha || github.event.inputs.sha || github.event.client_payload.ref || github.event.inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: probe-l10n-layout
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: 06a7138d68a3646f65838d8a2b1c1b3d4a36a832
          persist-credentials: false
          fetch-depth: 1
      - name: flags only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = './scripts/ci-verify-l10n-gates.ps1'
          $text = Get-Content -LiteralPath $script -Raw
          $flags = @(
            'no-pub', 'dart test', 'flutter test', 'flutter pub get', 'dart pub get',
            'Set-Location', 'Push-Location', 'gen-l10n', 'untranslated', 'package:test'
          )
          foreach ($f in $flags) {
            Write-Host ("flag {0}={1}" -f $f, $text.Contains($f))
          }
          Write-Host ("root_pubspec={0}" -f (Test-Path -LiteralPath './pubspec.yaml'))
          Write-Host ("root_package_config={0}" -f (Test-Path -LiteralPath './.dart_tool/package_config.json'))
          if (Test-Path -LiteralPath './pubspec.yaml') {
            $root = Get-Content -LiteralPath './pubspec.yaml' -Raw
            Write-Host ("root_workspace={0}" -f $root.Contains('workspace:'))
            Write-Host ("root_resolution={0}" -f $root.Contains('resolution:'))
            Write-Host ("root_flutter_test={0}" -f $root.Contains('flutter_test'))
          }
          $apps = @(
            'apps/daymica', 'apps/mail-box', 'apps/password-vault',
            'apps/yaoxiaobai/yaoxiaobai_app', 'apps/eye-care', 'apps/footprint',
            'apps/water-tracker', 'apps/admin-app', 'apps/shared_package'
          )
          foreach ($d in $apps) {
            $pub = Join-Path $d 'pubspec.yaml'
            $pc = Join-Path $d '.dart_tool/package_config.json'
            $hasPub = Test-Path -LiteralPath $pub
            $hasFt = $false
            $res = $false
            if ($hasPub) {
              $body = Get-Content -LiteralPath $pub -Raw
              $hasFt = $body.Contains('flutter_test')
              $res = $body.Contains('resolution:')
            }
            Write-Host ("app {0} pubspec={1} flutter_test={2} resolution={3} package_config={4}" -f $d, $hasPub, $hasFt, $res, (Test-Path -LiteralPath $pc))
          }

  meta:
    name: resolve-payload
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Allowlist ref/sha
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
          sha: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Set pending statuses
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          post() {
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="pending" \
              -f target_url="${RUN_URL}" \
              -f description="running on public-builder" \
              -f context="$1" >/dev/null
          }
          post "i18n-gate (daymica)"
          post "i18n-gate (mail-box)"
          post "i18n-gate (password-vault)"
          post "i18n-gate (yaoxiaobai)"
          post "i18n-gate (eye-care)"
          post "i18n-gate (footprint)"
          post "i18n-gate (issue-board)"
          post "i18n-gate (token-board)"
          post "i18n-gate (admin-app)"
          post "i18n-gate (shared_package)"

      - name: Post failure when resolve fails
        if: failure()
        env:
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          RAW_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha=$(printf '%s' "${RESOLVED_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=$(printf '%s' "${RAW_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "no allowlisted sha; dispatcher pending left in place"
            exit 0
          fi
          for ctx in \
            "i18n-gate (daymica)" \
            "i18n-gate (mail-box)" \
            "i18n-gate (password-vault)" \
            "i18n-gate (yaoxiaobai)" \
            "i18n-gate (eye-care)" \
            "i18n-gate (footprint)" \
            "i18n-gate (issue-board)" \
            "i18n-gate (token-board)" \
            "i18n-gate (admin-app)" \
            "i18n-gate (shared_package)"
          do
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${sha}" \
              -f state="failure" \
              -f target_url="${RUN_URL}" \
              -f description="payload rejected" \
              -f context="${ctx}" >/dev/null
          done

  verify:
    name: ci-verify-l10n-gates
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: probe l10n runner layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = './scripts/ci-verify-l10n-gates.ps1'
          $text = Get-Content -LiteralPath $script -Raw
          $flags = @(
            'no-pub', 'dart test', 'flutter test', 'flutter pub get', 'dart pub get',
            'Set-Location', 'Push-Location', 'gen-l10n', 'untranslated', 'package:test'
          )
          foreach ($f in $flags) {
            $hit = $text.Contains($f)
            Write-Host ("flag {0}={1}" -f $f, $hit)
          }
          Write-Host ("root_pubspec={0}" -f (Test-Path -LiteralPath './pubspec.yaml'))
          Write-Host ("root_package_config={0}" -f (Test-Path -LiteralPath './.dart_tool/package_config.json'))
          if (Test-Path -LiteralPath './pubspec.yaml') {
            $root = Get-Content -LiteralPath './pubspec.yaml' -Raw
            Write-Host ("root_workspace={0}" -f $root.Contains('workspace:'))
            Write-Host ("root_resolution={0}" -f $root.Contains('resolution:'))
            Write-Host ("root_flutter_test={0}" -f $root.Contains('flutter_test'))
          }
          $apps = @(
            'apps/daymica', 'apps/mail-box', 'apps/password-vault',
            'apps/yaoxiaobai/yaoxiaobai_app', 'apps/eye-care', 'apps/footprint',
            'apps/water-tracker', 'apps/admin-app', 'apps/shared_package'
          )
          foreach ($d in $apps) {
            $pub = Join-Path $d 'pubspec.yaml'
            $pc = Join-Path $d '.dart_tool/package_config.json'
            $hasPub = Test-Path -LiteralPath $pub
            $hasFt = $false
            $res = $false
            if ($hasPub) {
              $body = Get-Content -LiteralPath $pub -Raw
              $hasFt = $body.Contains('flutter_test')
              $res = $body.Contains('resolution:')
            }
            Write-Host ("app {0} pubspec={1} flutter_test={2} resolution={3} package_config={4}" -f $d, $hasPub, $hasFt, $res, (Test-Path -LiteralPath $pc))
          }
      - name: l10n gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath './scripts/ci-verify-l10n-gates.ps1')) {
            throw 'missing scripts/ci-verify-l10n-gates.ps1'
          }
          & ./scripts/ci-verify-l10n-gates.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  report:
    name: post-statuses
    needs: [meta, verify]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post conclusions
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          RESULT: ${{ needs.verify.result }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          case "$RESULT" in
            success) state=success; desc=success ;;
            cancelled) state=failure; desc=cancelled ;;
            *) state=failure; desc=failure ;;
          esac
          for ctx in \
            "i18n-gate (daymica)" \
            "i18n-gate (mail-box)" \
            "i18n-gate (password-vault)" \
            "i18n-gate (yaoxiaobai)" \
            "i18n-gate (eye-care)" \
            "i18n-gate (footprint)" \
            "i18n-gate (issue-board)" \
            "i18n-gate (token-board)" \
            "i18n-gate (admin-app)" \
            "i18n-gate (shared_package)"
          do
            echo "status ${ctx} ${state}"
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="$state" \
              -f target_url="${RUN_URL}" \
              -f description="$desc" \
              -f context="${ctx}" >/dev/null
          done
