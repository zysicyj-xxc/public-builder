# Delete logs of completed gate runs. A gate run dispatches this workflow
# with its own run id; the 5-minute schedule sweeps anything left behind.
# permissions: actions: write is required for DELETE /actions/runs/{id}/logs.
# If the repository workflow token is read-only, set Settings > Actions >
# General > Workflow permissions to read and write, or this job cannot delete.

name: Purge Gate Logs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'One completed run id. Empty sweeps completed gate runs.'
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: purge-gate-logs-${{ github.event.inputs.run_id || 'sweep' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  purge:
    name: purge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Delete gate logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: bash .github/scripts/purge-gate-logs.sh
