# Quality gates for private monorepo zysicyj-xxc/zysicyj (free public Actions minutes).
# Trust boundary: repository_dispatch client_payload and workflow_dispatch inputs are untrusted.
# Allowlist ref/sha before any API call. Status posts run in separate jobs so
# PRIVATE_REPO_ACCESS_TOKEN is not on the runner that executes private-repo code.
# Checkout, Flutter version (from the private repo .flutter-version), and token handling follow build-private*.yml. Go is 1.26.6.
# Shell is bash; release workflows use pwsh because their payloads are different.

name: Quality Analyze

on:
  repository_dispatch:
    types: [quality-analyze]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: true
        type: string
      sha:
        description: 'Commit SHA for checkout and status (default: resolve ref)'
        required: false
        type: string
      scopes:
        description: 'Comma list: backend,website,flutter (empty = all)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: quality-analyze-${{ github.event.client_payload.sha || github.event.inputs.sha || github.event.client_payload.ref || github.event.inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: resolve-payload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      sha: ${{ steps.r.outputs.sha }}
      do_backend: ${{ steps.r.outputs.do_backend }}
      do_website: ${{ steps.r.outputs.do_website }}
      do_flutter: ${{ steps.r.outputs.do_flutter }}
    steps:
      - name: Resolve ref/sha/scopes
        id: r
        env:
          RAW_REF: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
          RAW_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          RAW_SCOPES: ${{ github.event.client_payload.scopes || github.event.inputs.scopes }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          fail() { echo "ERROR: $*" >&2; exit 1; }

          normalize_ref() {
            local raw="$1"
            if [ -z "$raw" ]; then
              return 0
            fi
            if [ "${#raw}" -gt 200 ] || [ "$raw" != "${raw//[[:cntrl:]]/}" ]; then
              fail "ref failed allowlist"
            fi
            raw="${raw#"${raw%%[! ]*}"}"
            raw="${raw%"${raw##*[! ]}"}"
            if [ -z "$raw" ]; then
              return 0
            fi
            if printf '%s' "$raw" | grep -Eq '^[0-9a-fA-F]{40}$'; then
              printf '%s' "$raw" | tr 'A-F' 'a-f'
              return 0
            fi
            local full="$raw"
            if ! printf '%s' "$full" | grep -Eq '^refs/'; then
              if ! printf '%s' "$full" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
                fail "ref failed allowlist"
              fi
              full="refs/heads/$full"
            fi
            case "$full" in
              *..*) fail "ref failed allowlist" ;;
            esac
            if printf '%s' "$full" | grep -Eq '^refs/pull/[0-9]+/(head|merge)$'; then
              printf '%s' "$full"
              return 0
            fi
            local rest=""
            if printf '%s' "$full" | grep -Eq '^refs/heads/.+'; then
              rest=${full#refs/heads/}
            elif printf '%s' "$full" | grep -Eq '^refs/tags/.+'; then
              rest=${full#refs/tags/}
            else
              fail "ref failed allowlist"
            fi
            local -a segs=()
            IFS='/' read -r -a segs <<< "$rest"
            local joined s
            joined=$(IFS=/; printf '%s' "${segs[*]}")
            if [ "$joined" != "$rest" ] || [ "${#segs[@]}" -eq 0 ]; then
              fail "ref failed allowlist"
            fi
            for s in "${segs[@]}"; do
              if ! printf '%s' "$s" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
                fail "ref failed allowlist"
              fi
            done
            printf '%s' "$full"
          }

          normalize_sha() {
            local raw="$1"
            if [ -z "$raw" ]; then
              return 0
            fi
            if [ "${#raw}" -gt 64 ] || [ "$raw" != "${raw//[[:cntrl:]]/}" ]; then
              fail "sha failed allowlist"
            fi
            raw="${raw#"${raw%%[! ]*}"}"
            raw="${raw%"${raw##*[! ]}"}"
            raw=$(printf '%s' "$raw" | tr 'A-F' 'a-f')
            if ! printf '%s' "$raw" | grep -Eq '^[0-9a-f]{40}$'; then
              fail "sha failed allowlist"
            fi
            printf '%s' "$raw"
          }

          parse_scopes() {
            local raw="${1:-}"
            DO_B=false
            DO_W=false
            DO_F=false
            if [ "${#raw}" -gt 64 ] || [ "$raw" != "${raw//[[:cntrl:]]/}" ]; then
              fail "scopes failed allowlist"
            fi
            local scopes="${raw,,}"
            scopes="${scopes//[[:space:]]/}"
            if [ -z "$scopes" ]; then
              DO_B=true
              DO_W=true
              DO_F=true
              return 0
            fi
            if ! printf '%s' "$scopes" | grep -Eq '^[a-z,]+$'; then
              fail "scopes failed allowlist"
            fi
            local -a parts=()
            IFS=',' read -r -a parts <<< "$scopes"
            local p any=false
            for p in "${parts[@]}"; do
              case "$p" in
                '') ;;
                backend) DO_B=true; any=true ;;
                website) DO_W=true; any=true ;;
                flutter) DO_F=true; any=true ;;
                *) fail "unknown scope: $p" ;;
              esac
            done
            if [ "$any" != true ]; then
              fail "no scopes selected"
            fi
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            fail "PRIVATE_REPO_ACCESS_TOKEN is empty"
          fi

          REF_NORM=$(normalize_ref "${RAW_REF:-}")
          SHA_NORM=$(normalize_sha "${RAW_SHA:-}")
          parse_scopes "${RAW_SCOPES:-}"

          if [ -n "$SHA_NORM" ]; then
            TARGET=$SHA_NORM
          elif [ -n "$REF_NORM" ]; then
            TARGET=$REF_NORM
          else
            fail "ref or sha required"
          fi
          if ! printf '%s' "$TARGET" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            fail "ref failed allowlist"
          fi

          # commits API peels annotated tags and accepts heads, tags, and refs/pull/N/{head,merge}.
          SHA=$(gh api "repos/zysicyj-xxc/zysicyj/commits/${TARGET}" --jq .sha)
          SHA=$(printf '%s' "$SHA" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            fail "could not resolve commit"
          fi

          {
            echo "ref=${REF_NORM:-$SHA}"
            echo "sha=$SHA"
            echo "do_backend=$DO_B"
            echo "do_website=$DO_W"
            echo "do_flutter=$DO_F"
          } >> "$GITHUB_OUTPUT"
          echo "OK sha=$SHA backend=$DO_B website=$DO_W flutter=$DO_F"

  backend:
    name: backend
    needs: meta
    if: ${{ needs.meta.outputs.do_backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Throwaway MySQL 8. Password lives only in this container; not a repo secret.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: zysicyj_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - name: Create tables AutoMigrate skips
        env:
          MYSQL_PWD: test
        run: |
          set -euo pipefail
          # testutil AutoMigrate omits these. The ps1 only starts MySQL; a fresh
          # database needs the CREATE TABLE IF NOT EXISTS scripts.
          cid=$(docker ps -q --filter ancestor=mysql:8.0 | head -n 1)
          if [ -z "$cid" ]; then
            echo "ERROR: mysql service container not found" >&2
            docker ps --format '{{.Image}}' >&2
            exit 1
          fi
          for n in \
            security_settings.sql \
            user_totp_trusted_devices.sql \
            user_app_memberships.sql
          do
            if [ -f "backend/sql/已执行-测试/$n" ]; then
              f="backend/sql/已执行-测试/$n"
            elif [ -f "backend/sql/$n" ]; then
              f="backend/sql/$n"
            else
              echo "ERROR: $n not found" >&2
              exit 1
            fi
            docker exec -i -e MYSQL_PWD "$cid" mysql --protocol=TCP -uroot zysicyj_test < "$f" >/dev/null
          done
          echo "PASS sql"
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - name: go build + test
        working-directory: backend
        env:
          # Same query string as scripts/lib/lib-backend-test-db.ps1 local DSN. Port is the mapped 3306.
          TEST_DATABASE_DSN: "root:test@tcp(127.0.0.1:3306)/zysicyj_test?charset=utf8mb4&parseTime=True&loc=Local"
          CLEAN_TEST_DB: "true"
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: backend
          QUIET_KIND: go-test
          QUIET_CMD: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/backend-test.sh"
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-backend
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  website:
    name: website
    needs: meta
    if: ${{ needs.meta.outputs.do_website == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - name: pnpm install + vitest
        working-directory: website
        env:
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: website
          QUIET_KIND: generic
          QUIET_CMD: 'corepack enable && pnpm install --frozen-lockfile && pnpm exec vitest run'
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-website
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  flutter:
    name: flutter-analyze
    needs: meta
    if: ${{ needs.meta.outputs.do_flutter == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read Flutter version
        id: flutter
        run: |
          set -euo pipefail
          if [ ! -f .flutter-version ]; then
            echo "ERROR: missing .flutter-version" >&2
            exit 1
          fi
          ver=$(tr -d '[:space:]' < .flutter-version)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: .flutter-version is not X.Y.Z" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: 'stable'
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-analyze-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-analyze-
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - name: pub get + analyze
        env:
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
        run: |
          set -euo pipefail
          # shared_package first. pub get stays serial; analyze does not re-run pub.
          APPS=(
            apps/shared_package
            apps/daymica
            apps/yaoxiaobai/yaoxiaobai_app
            apps/footprint
            apps/password-vault
            apps/mail-box
            apps/eye-care
            apps/admin-app
            apps/water-tracker
          )
          label_for() {
            case "$1" in
              apps/yaoxiaobai/yaoxiaobai_app) printf '%s' yaoxiaobai ;;
              *) basename "$1" ;;
            esac
          }
          present=()
          for d in "${APPS[@]}"; do
            label=$(label_for "$d")
            if [ ! -f "${d}/pubspec.yaml" ]; then
              echo "SKIP ${label}"
              continue
            fi
            QUIET_LABEL="${label}" QUIET_KIND=generic \
              QUIET_CMD="cd $(printf '%q' "$d") && flutter pub get" \
              bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
            present+=("$d")
          done
          if [ "${#present[@]}" -eq 0 ]; then
            echo "FAIL flutter-analyze"
            exit 1
          fi
          FAIL=0
          PIDS=()
          for d in "${present[@]}"; do
            label=$(label_for "$d")
            (
              QUIET_LABEL="${label}" QUIET_KIND=flutter-analyze \
                QUIET_CMD="cd $(printf '%q' "$d") && flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos" \
                bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
            ) &
            PIDS+=("$!")
          done
          for pid in "${PIDS[@]}"; do
            if ! wait "${pid}"; then
              FAIL=1
            fi
          done
          if [ "${FAIL}" -ne 0 ]; then
            echo "FAIL flutter-analyze"
            exit 1
          fi
      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-flutter-analyze
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  backend-status:
    name: status backend
    needs: [meta, backend]
    if: ${{ always() && needs.meta.result == 'success' && needs.meta.outputs.do_backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Post quality/backend
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          SHA: ${{ needs.meta.outputs.sha }}
          RESULT: ${{ needs.backend.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          case "$RESULT" in
            success) STATE=success; DESC="backend success" ;;
            cancelled) STATE=failure; DESC="backend cancelled" ;;
            *) STATE=failure; DESC="backend failure" ;;
          esac
          echo "quality/backend $STATE result=$RESULT"
          bash .github/scripts/api-retry.sh status "$SHA" "$STATE" "quality/backend" "$DESC" "$RUN_URL"

  website-status:
    name: status website
    needs: [meta, website]
    if: ${{ always() && needs.meta.result == 'success' && needs.meta.outputs.do_website == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Post quality/website
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          SHA: ${{ needs.meta.outputs.sha }}
          RESULT: ${{ needs.website.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          case "$RESULT" in
            success) STATE=success; DESC="website success" ;;
            cancelled) STATE=failure; DESC="website cancelled" ;;
            *) STATE=failure; DESC="website failure" ;;
          esac
          echo "quality/website $STATE result=$RESULT"
          bash .github/scripts/api-retry.sh status "$SHA" "$STATE" "quality/website" "$DESC" "$RUN_URL"

  flutter-status:
    name: status flutter-analyze
    needs: [meta, flutter]
    if: ${{ always() && needs.meta.result == 'success' && needs.meta.outputs.do_flutter == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Post quality/flutter-analyze
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          SHA: ${{ needs.meta.outputs.sha }}
          RESULT: ${{ needs.flutter.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          case "$RESULT" in
            success) STATE=success; DESC="flutter-analyze success" ;;
            cancelled) STATE=failure; DESC="flutter-analyze cancelled" ;;
            *) STATE=failure; DESC="flutter-analyze failure" ;;
          esac
          echo "quality/flutter-analyze $STATE result=$RESULT"
          bash .github/scripts/api-retry.sh status "$SHA" "$STATE" "quality/flutter-analyze" "$DESC" "$RUN_URL"

  purge-logs:
    name: schedule-log-purge
    needs: [meta, backend-status, website-status, flutter-status]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Request log purge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: bash .github/scripts/request-purge.sh || echo "FAIL purge-request"
