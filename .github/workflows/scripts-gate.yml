# Scripts test gate for zysicyj-xxc/zysicyj.
# Trust boundary: repository_dispatch client_payload and workflow_dispatch inputs are untrusted.
# Allowlist ref/sha before any API call. Status posts run in a separate job so
# PRIVATE_REPO_ACCESS_TOKEN is not on the runner that executes private-repo code.
#
# Contexts match the paused private Scripts Test Gate: one check named
# "layout + domain gates" (assert-scripts-layout.ps1 + assert-domain-registry.ps1)
# and one check per scripts/**/*.tests.ps1. assert-domain-registry.ps1 stays here
# because it is part of that combined check. The separate domain-gate listener
# is a different workflow and is not folded into this one.
#
# Tests that need a desktop, an external service, or that would print credential
# material are skipped. Their status is success with description skipped-*.
# Runner output is paths, exit codes, and those reasons. Secret-shaped output
# is dropped before it is logged.
# Checked-out commits must match the payload sha. Optional CNB writeback uses
# CNB_STATUS_TOKEN and skips when that secret is empty. The token stays off
# the runner that executes private scripts.

name: Scripts Gate

on:
  repository_dispatch:
    types: [scripts-gate]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: true
        type: string
      sha:
        description: 'Commit SHA for checkout and status (default: resolve ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: scripts-gate-${{ github.event.client_payload.sha || github.event.inputs.sha || github.event.client_payload.ref || github.event.inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: resolve-payload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      tests: ${{ steps.list.outputs.tests }}
      pr: ${{ steps.cnb.outputs.pr }}
      cnb_build: ${{ steps.cnb.outputs.cnb_build }}
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Self-check classifier
        run: |
          set -euo pipefail
          python3 .github/scripts/scripts_gate_run.py --selftest
          bash .github/scripts/assert-head-sha.sh --selftest
          python3 .github/scripts/cnb_payload.py --selftest
          python3 .github/scripts/cnb_report.py --selftest

      - name: Allowlist ref/sha
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
          sha: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Allowlist CNB payload fields
        id: cnb
        env:
          RAW_PR: ${{ github.event.client_payload.pr }}
          RAW_CNB_BUILD: ${{ github.event.client_payload.cnb_build }}
        run: python3 .github/scripts/cnb_payload.py

      - name: List script checks
        id: list
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/tree.json"' EXIT
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          gh api "repos/zysicyj-xxc/zysicyj/git/trees/${SHA}?recursive=1" > "$RUNNER_TEMP/tree.json"
          python3 .github/scripts/scripts_gate_run.py --from-tree "$RUNNER_TEMP/tree.json" "$GITHUB_OUTPUT"

      - name: Set pending statuses
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          TESTS_JSON: ${{ steps.list.outputs.tests }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          post() {
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="pending" \
              -f target_url="${RUN_URL}" \
              -f description="running on public-builder" \
              -f context="$1" >/dev/null
          }
          post "layout + domain gates"
          echo "$TESTS_JSON" | jq -er '.[]' | while IFS= read -r ctx; do
            if ! printf '%s' "$ctx" | grep -Eq '^scripts/([A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+\.tests\.ps1$'; then
              echo "ERROR: test path failed allowlist" >&2
              exit 1
            fi
            post "$ctx"
          done

      - name: Post failure when resolve fails
        if: failure()
        env:
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          RAW_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          TESTS_JSON: ${{ steps.list.outputs.tests }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha=$(printf '%s' "${RESOLVED_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=$(printf '%s' "${RAW_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "no allowlisted sha; dispatcher pending left in place"
            exit 0
          fi
          post() {
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${sha}" \
              -f state="failure" \
              -f target_url="${RUN_URL}" \
              -f description="payload rejected" \
              -f context="$1" >/dev/null
          }
          post "layout + domain gates"
          if [ -n "${TESTS_JSON:-}" ]; then
            echo "$TESTS_JSON" | jq -r '.[]?' | while IFS= read -r ctx; do
              [ -n "$ctx" ] || continue
              if printf '%s' "$ctx" | grep -Eq '^scripts/([A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+\.tests\.ps1$'; then
                post "$ctx"
              fi
            done
          fi

  verify:
    name: scripts gate
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4
        with:
          path: runner

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          path: repo
          persist-credentials: false
          fetch-depth: 1

      - name: Check commit sha
        working-directory: repo
        env:
          EXPECT_SHA: ${{ needs.meta.outputs.sha }}
        run: bash "$GITHUB_WORKSPACE/runner/.github/scripts/assert-head-sha.sh" "$EXPECT_SHA"

      - name: Checkout public workflows for script tests
        uses: actions/checkout@v4
        with:
          path: repo/public-builder
          persist-credentials: false
          fetch-depth: 1

      - name: Python deps for Play usage tests
        run: python -m pip install --user --break-system-packages google-auth google-api-python-client

      - name: Run layout, domain, and script tests
        working-directory: repo
        env:
          TESTS_JSON: ${{ needs.meta.outputs.tests }}
          RESULTS_PATH: ${{ runner.temp }}/results.tsv
        run: python3 "$GITHUB_WORKSPACE/runner/.github/scripts/scripts_gate_run.py" --run

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-gate-results
          path: ${{ runner.temp }}/results.tsv
          if-no-files-found: warn

  report:
    name: post-statuses
    needs: [meta, verify]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download results
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: scripts-gate-results
          path: gate-results

      - name: Post conclusions
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          TESTS_JSON: ${{ needs.meta.outputs.tests }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          declare -A got_state=()
          declare -A got_desc=()
          if [ -f gate-results/results.tsv ]; then
            while IFS=$'\t' read -r ctx state desc; do
              [ -n "${ctx:-}" ] || continue
              case "$state" in
                success|failure) ;;
                *) continue ;;
              esac
              case "$desc" in
                success|failure|skipped-desktop|skipped-external|skipped-sensitive) ;;
                *) continue ;;
              esac
              if [ "$state" = failure ] && [ "$desc" != failure ]; then
                continue
              fi
              got_state["$ctx"]=$state
              got_desc["$ctx"]=$desc
            done < gate-results/results.tsv
          fi
          post() {
            local ctx="$1" state="$2" desc="$3"
            echo "status ${ctx} ${state} ${desc}"
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="$state" \
              -f target_url="${RUN_URL}" \
              -f description="$desc" \
              -f context="$ctx" >/dev/null
          }
          post_one() {
            local ctx="$1"
            if [ -n "${got_state[$ctx]:-}" ]; then
              post "$ctx" "${got_state[$ctx]}" "${got_desc[$ctx]}"
            elif [ "$VERIFY_RESULT" = cancelled ]; then
              post "$ctx" failure cancelled
            else
              post "$ctx" failure failure
            fi
          }
          post_one "layout + domain gates"
          echo "$TESTS_JSON" | jq -er '.[]' | while IFS= read -r ctx; do
            if ! printf '%s' "$ctx" | grep -Eq '^scripts/([A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+\.tests\.ps1$'; then
              echo "ERROR: test path failed allowlist" >&2
              exit 1
            fi
            post_one "$ctx"
          done

  cnb-report:
    name: cnb-report
    needs: [meta, verify]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download results
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: scripts-gate-results
          path: gate-results

      - name: Write results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          src = "gate-results/results.tsv"
          dst = os.environ["RUNNER_TEMP"] + "/cnb-results.tsv"
          ctx_re = re.compile(r"^[A-Za-z0-9 ._+/()-]{1,120}$")
          desc_ok = {
              "success",
              "failure",
              "skipped-desktop",
              "skipped-external",
              "skipped-sensitive",
          }
          rows = []
          failed_hidden = False
          if os.path.isfile(src):
              with open(src, encoding="utf-8") as fh:
                  for line in fh:
                      parts = line.rstrip("\n").split("\t")
                      if len(parts) != 3:
                          continue
                      ctx, state, desc = parts
                      if state not in ("success", "failure") or desc not in desc_ok:
                          if state == "failure":
                              failed_hidden = True
                          continue
                      if state == "failure" and desc != "failure":
                          failed_hidden = True
                          continue
                      if not ctx_re.fullmatch(ctx):
                          if state == "failure":
                              failed_hidden = True
                          continue
                      rows.append((ctx, state, desc))
          if not rows:
              rows = [("layout + domain gates", "failure", "failure")]
          if len(rows) > 40 or failed_hidden:
              layout = [row for row in rows if row[0] == "layout + domain gates"][:1]
              rest = [row for row in rows if row[0] != "layout + domain gates"]
              state = "failure" if failed_hidden or any(row[1] == "failure" for row in rest) else "success"
              desc = "failure" if state == "failure" else "success"
              rows = layout + [("scripts tests", state, desc)]
              if len(rows) > 40:
                  rows = rows[:40]
          with open(dst, "w", encoding="utf-8") as fh:
              for ctx, state, desc in rows:
                  fh.write(f"{ctx}\t{state}\t{desc}\n")
          print(f"cnb rows {len(rows)}")
          PY

      - name: Report to CNB
        env:
          CNB_STATUS_TOKEN: ${{ secrets.CNB_STATUS_TOKEN }}
          CNB_SHA: ${{ needs.meta.outputs.sha }}
          CNB_PR: ${{ needs.meta.outputs.pr }}
          CNB_BUILD: ${{ needs.meta.outputs.cnb_build }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/cnb_report.py --results "$RUNNER_TEMP/cnb-results.tsv"
