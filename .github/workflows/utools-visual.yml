# uTools visual gate for zysicyj-xxc/zysicyj.
# Trust boundary: repository_dispatch client_payload and workflow_dispatch inputs are untrusted.
# Allowlist ref/sha before any API call. Status posts run in a separate job so
# PRIVATE_REPO_ACCESS_TOKEN is not on the runner that executes private-repo code.
#
# Contexts: export-diff, and gate (<plugin>) for easy-script, bookmark-collector,
# blog-sync, daymica-capture.
# export-diff regenerates canonical tokens (ADR 0006 export_web_tokens via the
# flutter test, not bare dart run) and fails if generated/ or utools/ drifts.
# gate (<plugin>) runs the plugin test script. The private utools-test workflow
# uses pnpm test. Hosted checkout has package.json and often no pnpm-lock.yaml
# under the plugin or utools/, so the installer also accepts a plugin
# package-lock.json, a repo-root pnpm-lock.yaml, or an install from package.json.
# Before install, the runner rewrites private CNB npm tarball URLs in the
# working-copy lockfiles to https://registry.npmjs.org/. That rewrite is not
# committed, and raw URLs are not logged.
# A plugin with no scripts.test stays in the matrix, including daymica-capture.
# The job exits 0 and the status description is "SKIP test no-script".
# Node 22, Flutter version from the private repo .flutter-version.
# The gate matrix is meta's JSON plugin list. Job-level if cannot read matrix.
# export-diff stays a separate job.

name: uTools Visual

on:
  repository_dispatch:
    types: [utools-visual]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: true
        type: string
      sha:
        description: 'Commit SHA for checkout and status (default: resolve ref)'
        required: false
        type: string
      scopes:
        description: 'Comma list: export-diff,easy-script,bookmark-collector,blog-sync,daymica-capture. Empty runs all.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: utools-visual-${{ github.event.client_payload.sha || github.event.inputs.sha || github.event.client_payload.ref || github.event.inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: resolve-payload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      scopes: ${{ steps.pick.outputs.scopes }}
      plugins: ${{ steps.pick.outputs.plugins }}
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Allowlist ref/sha
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
          sha: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Pick scopes
        id: pick
        env:
          RAW: ${{ github.event.client_payload.scopes || github.event.inputs.scopes }}
        run: |
          set -euo pipefail
          python3 - "$RAW" <<'PY'
          import json, os, sys
          order = ["export-diff", "easy-script", "bookmark-collector", "blog-sync", "daymica-capture"]
          raw = (sys.argv[1] or "").replace(" ", "")
          if raw == "":
              scopes = order
          else:
              scopes = []
              for part in raw.split(","):
                  if not part:
                      continue
                  if part not in order:
                      sys.exit("FAIL scopes")
                  if part not in scopes:
                      scopes.append(part)
              if not scopes:
                  sys.exit("FAIL scopes")
          plugins = [scope for scope in scopes if scope != "export-diff"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("scopes= " + " ".join(scopes) + " \n")
              fh.write("plugins=" + json.dumps(plugins, separators=(",", ":")) + "\n")
          print("PASS scopes count=" + str(len(scopes)))
          PY

      - name: Post failure when resolve fails
        if: failure()
        env:
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          RAW_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha=$(printf '%s' "${RESOLVED_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=$(printf '%s' "${RAW_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "no allowlisted sha; dispatcher pending left in place"
            exit 0
          fi
          mark="${RUNNER_TEMP}/rate-limited"
          rm -f "$mark"
          post() {
            local ctx="$1" out rc
            if [ -f "$mark" ]; then
              bash .github/scripts/api-retry.sh post-limited "$sha" "$RUN_URL" "$ctx"
              return
            fi
            set +e
            out=$(bash .github/scripts/api-retry.sh status "$sha" failure "$ctx" "payload rejected" "$RUN_URL")
            rc=$?
            set -e
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -Fxq 'FAIL report rate-limited'; then
              : >"$mark"
            fi
            return "$rc"
          }
          for ctx in \
            "export-diff" \
            "gate (easy-script)" \
            "gate (bookmark-collector)" \
            "gate (blog-sync)" \
            "gate (daymica-capture)"
          do
            post "$ctx"
          done

  export-diff:
    name: export-diff
    needs: meta
    if: contains(needs.meta.outputs.scopes, ' export-diff ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read Flutter version
        id: flutter
        run: |
          set -euo pipefail
          if [ ! -f .flutter-version ]; then
            echo "ERROR: missing .flutter-version" >&2
            exit 1
          fi
          ver=$(tr -d '[:space:]' < .flutter-version)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: .flutter-version is not X.Y.Z" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "flutter-version=$ver"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: 'stable'
          cache: true
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - name: regenerate tokens and diff utools
        env:
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: export-diff
          QUIET_KIND: generic
          QUIET_CMD: |
            set -euo pipefail
            cd apps/shared_package
            flutter pub get
            flutter test --concurrency=2 --reporter json test/tokens/web_token_export_test.dart
            cd ../..
            git diff --exit-code -- apps/shared_package/generated utools
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"

  gate:
    name: gate (${{ matrix.plugin }})
    needs: meta
    if: needs.meta.result == 'success' && needs.meta.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.meta.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - name: pnpm test
        id: gate
        env:
          PLUGIN: ${{ matrix.plugin }}
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: ${{ matrix.plugin }}
          QUIET_KIND: generic
          QUIET_CMD: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/utools-gate.sh"
        run: |
          set -euo pipefail
          set +e
          out=$(bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh")
          rc=$?
          set -e
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -qx 'SKIP test no-script'; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: "SKIP test no-script"
        if: success() && steps.gate.outputs.skipped == 'true'
        run: echo "SKIP test no-script"

  report:
    name: post-statuses
    needs: [meta, export-diff, gate]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Post conclusions
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          ACTIONS_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          SCOPES: ${{ needs.meta.outputs.scopes }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          declare -A conc=()
          declare -A detail=()
          contexts=()
          for scope in ${SCOPES}; do
            case "$scope" in
              export-diff) contexts+=("export-diff") ;;
              easy-script|bookmark-collector|blog-sync|daymica-capture) contexts+=("gate (${scope})") ;;
              *) echo "FAIL scopes" >&2; exit 1 ;;
            esac
          done
          list_jobs() {
            GH_TOKEN="$ACTIONS_TOKEN" bash .github/scripts/api-retry.sh call --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | [.name, (.conclusion // ""), (if ((.steps // []) | any(.name == "SKIP test no-script" and .conclusion == "success")) then "skipped" else "" end)] | @tsv'
          }
          for attempt in 1 2 3 4 5 6; do
            conc=()
            detail=()
            set +e
            listing=$(list_jobs)
            list_rc=$?
            set -e
            if [ "$list_rc" -eq 2 ]; then
              GH_TOKEN="$STATUS_TOKEN" bash .github/scripts/api-retry.sh post-limited \
                "$SHA" "$RUN_URL" "${contexts[@]}"
              exit 0
            fi
            if [ "$list_rc" -ne 0 ]; then
              exit "$list_rc"
            fi
            while IFS=$'\t' read -r name conclusion skipped; do
              [ -n "$name" ] || continue
              conc["$name"]=$conclusion
              detail["$name"]=$skipped
            done <<<"$listing"
            missing=0
            for ctx in "${contexts[@]}"; do
              if [ -z "${conc[$ctx]:-}" ]; then
                missing=1
                echo "waiting for ${ctx} (attempt ${attempt})"
              fi
            done
            if [ "$missing" -eq 0 ]; then
              break
            fi
            sleep 5
          done
          for name in "${!conc[@]}"; do
            if [ "${detail[$name]:-}" = "skipped" ]; then
              echo "job ${name} => ${conc[$name]} SKIP"
            else
              echo "job ${name} => ${conc[$name]}"
            fi
          done
          post() {
            local ctx="$1" conclusion="${2:-}" skipped="${3:-}" state desc
            case "$conclusion" in
              success)
                state=success
                if [ "$skipped" = "skipped" ]; then
                  desc="SKIP test no-script"
                else
                  desc=success
                fi
                ;;
              cancelled) state=failure; desc=cancelled ;;
              *) state=failure; desc=failure ;;
            esac
            echo "status ${ctx} ${state} ${desc}"
            if [ -f "${RUNNER_TEMP}/rate-limited" ]; then
              GH_TOKEN="$STATUS_TOKEN" bash .github/scripts/api-retry.sh post-limited \
                "$SHA" "$RUN_URL" "$ctx"
              return 0
            fi
            local out rc
            set +e
            out=$(GH_TOKEN="$STATUS_TOKEN" bash .github/scripts/api-retry.sh status \
              "$SHA" "$state" "$ctx" "$desc" "$RUN_URL")
            rc=$?
            set -e
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -Fxq 'FAIL report rate-limited'; then
              : >"${RUNNER_TEMP}/rate-limited"
            fi
            return "$rc"
          }
          rm -f "${RUNNER_TEMP}/rate-limited"
          for ctx in "${contexts[@]}"; do
            post "$ctx" "${conc[$ctx]:-}" "${detail[$ctx]:-}"
          done

  purge-logs:
    name: schedule-log-purge
    needs: [meta, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Request log purge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: bash .github/scripts/request-purge.sh || echo "FAIL purge-request"
