# Visual lint + shared_package golden tests for zysicyj-xxc/zysicyj.
# Trust boundary: repository_dispatch client_payload and workflow_dispatch inputs are untrusted.
# Allowlist ref/sha before any API call. Status posts run in a separate job so
# PRIVATE_REPO_ACCESS_TOKEN is not on the runner that executes private-repo code.
#
# Commands (private repo was not readable from this environment; these match the
# former CI behavior recorded for tools/visual_lint):
#   app pubspec depends on visual_lint -> dart run custom_lint
#   otherwise (daymica's custom_lint is riverpod_lint only) scan code and pubspec
#   only, not markdown or other docs:
#     grep package:shadcn_ui in lib/*.dart (--include='*.dart')
#     and shadcn_ui: keys under pubspec.yaml dependencies / dev_dependencies
#     (a comment line that mentions shadcn_ui does not count)
#   golden-tests: flutter test files under apps/shared_package that call matchesGoldenFile
# Flutter version comes from the private repo .flutter-version, matching build-private / quality-analyze.

name: Visual Lint

on:
  repository_dispatch:
    types: [visual-lint]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: true
        type: string
      sha:
        description: 'Commit SHA for checkout and status (default: resolve ref)'
        required: false
        type: string
      only:
        description: 'Comma list of apps plus golden. Empty runs every visual check.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-lint-${{ github.event.client_payload.sha || github.event.inputs.sha || github.event.client_payload.ref || github.event.inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: resolve-payload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      run_apps: ${{ steps.pick.outputs.run_apps }}
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Allowlist ref/sha
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
          sha: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Pick checks
        id: pick
        env:
          RAW: ${{ github.event.client_payload.only || github.event.inputs.only }}
        run: |
          set -euo pipefail
          python3 - "$RAW" <<'PY'
          import os, sys
          order = ["mail-box", "password-vault", "eye-care", "footprint", "yaoxiaobai", "daymica", "water-tracker", "golden"]
          raw = (sys.argv[1] or "").replace(" ", "")
          if raw == "":
              apps = order
          else:
              apps = []
              for part in raw.split(","):
                  if not part:
                      continue
                  if part not in order:
                      sys.exit("FAIL apps")
                  if part not in apps:
                      apps.append(part)
              if not apps:
                  sys.exit("FAIL apps")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("run_apps= " + " ".join(apps) + " \n")
          print("PASS apps count=" + str(len(apps)))
          PY

      - name: Set pending statuses
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          RUN_APPS: ${{ steps.pick.outputs.run_apps }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          post() {
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="pending" \
              -f target_url="${RUN_URL}" \
              -f description="running" \
              -f context="$1" >/dev/null
          }
          for app in ${RUN_APPS}; do
            case "$app" in
              mail-box|password-vault|eye-care|footprint|yaoxiaobai|daymica|water-tracker)
                post "visual-lint (${app})"
                ;;
              golden) post "golden-tests (shared_package)" ;;
              *) echo "FAIL apps" >&2; exit 1 ;;
            esac
          done
          echo "PASS pending"

      - name: Post failure when resolve fails
        if: failure()
        env:
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          RAW_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha=$(printf '%s' "${RESOLVED_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=$(printf '%s' "${RAW_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "no allowlisted sha; dispatcher pending left in place"
            exit 0
          fi
          for ctx in \
            "visual-lint (mail-box)" \
            "visual-lint (password-vault)" \
            "visual-lint (eye-care)" \
            "visual-lint (footprint)" \
            "visual-lint (yaoxiaobai)" \
            "visual-lint (daymica)" \
            "visual-lint (water-tracker)" \
            "golden-tests (shared_package)"
          do
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${sha}" \
              -f state="failure" \
              -f target_url="${RUN_URL}" \
              -f description="payload rejected" \
              -f context="${ctx}" >/dev/null
          done

  lint:
    name: visual-lint (${{ matrix.app }})
    needs: meta
    if: contains(needs.meta.outputs.run_apps, format(' {0} ', matrix.app))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - mail-box
          - password-vault
          - eye-care
          - footprint
          - yaoxiaobai
          - daymica
          - water-tracker
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read Flutter version
        id: flutter
        run: |
          set -euo pipefail
          if [ ! -f .flutter-version ]; then
            echo "ERROR: missing .flutter-version" >&2
            exit 1
          fi
          ver=$(tr -d '[:space:]' < .flutter-version)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: .flutter-version is not X.Y.Z" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "flutter-version=$ver"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: 'stable'
          cache: true
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-visual-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/pubspec.lock', matrix.app)) }}
          restore-keys: |
            pub-${{ runner.os }}-visual-${{ matrix.app }}-
      - name: visual_lint
        env:
          APP: ${{ matrix.app }}
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: ${{ matrix.app }}
          QUIET_KIND: generic
          QUIET_CMD: |
            set -euo pipefail
            case "$APP" in
              mail-box) dir=apps/mail-box ;;
              password-vault) dir=apps/password-vault ;;
              eye-care) dir=apps/eye-care ;;
              footprint) dir=apps/footprint ;;
              yaoxiaobai) dir=apps/yaoxiaobai/yaoxiaobai_app ;;
              daymica) dir=apps/daymica ;;
              water-tracker) dir=apps/water-tracker ;;
              *) exit 1 ;;
            esac
            test -f "${dir}/pubspec.yaml"
            cd "${dir}"
            flutter pub get
            if grep -q 'visual_lint' pubspec.yaml; then
              dart run custom_lint
            else
              test -d lib
              hit=0
              if grep -R -n --include='*.dart' 'package:shadcn_ui' lib >/dev/null; then
                hit=1
              fi
              if awk '
                /^[^[:space:]#]/ { sec=$1; sub(/:.*/, "", sec); next }
                /^[[:space:]]*#/ { next }
                (sec=="dependencies" || sec=="dev_dependencies") && /^[[:space:]]*shadcn_ui:/ { found=1 }
                END { exit(found ? 0 : 1) }
              ' pubspec.yaml; then
                hit=1
              fi
              test "$hit" -eq 0
            fi
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-visual-${{ strategy.job-index }}
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  golden:
    name: golden-tests (shared_package)
    needs: meta
    if: contains(needs.meta.outputs.run_apps, ' golden ')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read Flutter version
        id: flutter
        run: |
          set -euo pipefail
          if [ ! -f .flutter-version ]; then
            echo "ERROR: missing .flutter-version" >&2
            exit 1
          fi
          ver=$(tr -d '[:space:]' < .flutter-version)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: .flutter-version is not X.Y.Z" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "flutter-version=$ver"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: 'stable'
          cache: true
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-golden-${{ hashFiles('apps/shared_package/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-golden-
      - name: golden tests
        env:
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: golden
          QUIET_KIND: flutter-test
          QUIET_CMD: |
            set -euo pipefail
            cd apps/shared_package
            flutter pub get
            mapfile -t files < <(grep -R -l -E 'matchesGoldenFile|testGoldens|goldenFileComparator' test --include='*_test.dart' || true)
            test "${#files[@]}" -gt 0
            flutter test --concurrency=2 --reporter json "${files[@]}"
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-golden
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  report:
    name: post-statuses
    needs: [meta, lint, golden]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post conclusions
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          ACTIONS_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_APPS: ${{ needs.meta.outputs.run_apps }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          declare -A conc=()
          contexts=()
          for app in ${RUN_APPS}; do
            case "$app" in
              mail-box|password-vault|eye-care|footprint|yaoxiaobai|daymica|water-tracker)
                contexts+=("visual-lint (${app})")
                ;;
              golden) contexts+=("golden-tests (shared_package)") ;;
              *) echo "FAIL apps" >&2; exit 1 ;;
            esac
          done
          for attempt in 1 2 3 4 5 6; do
            conc=()
            while IFS=$'\t' read -r name conclusion; do
              [ -n "$name" ] || continue
              conc["$name"]=$conclusion
            done < <(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | [.name, (.conclusion // "")] | @tsv')
            missing=0
            for ctx in "${contexts[@]}"; do
              if [ -z "${conc[$ctx]:-}" ]; then
                missing=1
                echo "waiting for ${ctx} (attempt ${attempt})"
              fi
            done
            if [ "$missing" -eq 0 ]; then
              break
            fi
            sleep 5
          done
          for name in "${!conc[@]}"; do
            echo "job ${name} => ${conc[$name]}"
          done
          post() {
            local ctx="$1" conclusion="${2:-}" state desc
            case "$conclusion" in
              success) state=success; desc=success ;;
              cancelled) state=failure; desc=cancelled ;;
              *) state=failure; desc=failure ;;
            esac
            echo "status ${ctx} ${state}"
            GH_TOKEN="$STATUS_TOKEN" gh api --method POST \
              "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="$state" \
              -f target_url="${RUN_URL}" \
              -f description="$desc" \
              -f context="$ctx" >/dev/null
          }
          for ctx in "${contexts[@]}"; do
            post "$ctx" "${conc[$ctx]:-}"
          done

  purge-logs:
    name: schedule-log-purge
    needs: [meta, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Request log purge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: bash .github/scripts/request-purge.sh || echo "FAIL purge-request"
