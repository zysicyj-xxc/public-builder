# Visual lint + shared_package golden tests for zysicyj-xxc/zysicyj.
# Trust boundary: repository_dispatch client_payload and workflow_dispatch inputs are untrusted.
# Allowlist ref/sha before any API call. Status posts run in a separate job so
# PRIVATE_REPO_ACCESS_TOKEN is not on the runner that executes private-repo code.
#
# Commands (private repo was not readable from this environment; these match the
# former CI behavior recorded for tools/visual_lint):
#   app pubspec depends on visual_lint -> dart run custom_lint
#   otherwise (daymica's custom_lint is riverpod_lint only) scan code and pubspec
#   only, not markdown or other docs:
#     grep package:shadcn_ui in lib/*.dart (--include='*.dart')
#     and shadcn_ui: keys under pubspec.yaml dependencies / dev_dependencies
#     (a comment line that mentions shadcn_ui does not count)
#   golden-tests: flutter test files under apps/shared_package that call matchesGoldenFile
# Flutter 3.44.8 matches build-private / quality-analyze.

name: Visual Lint

on:
  repository_dispatch:
    types: [visual-lint]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: true
        type: string
      sha:
        description: 'Commit SHA for checkout and status (default: resolve ref)'
        required: false
        type: string
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-lint-${{ github.event.client_payload.sha || github.event.inputs.sha || github.event.client_payload.ref || github.event.inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: resolve-payload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Allowlist ref/sha
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ github.event_name == 'pull_request' && 'af20c510e81919ff417746824e44a73d2e8d6f8a' || github.event.client_payload.ref || github.event.inputs.ref }}
          sha: ${{ github.event_name == 'pull_request' && 'af20c510e81919ff417746824e44a73d2e8d6f8a' || github.event.client_payload.sha || github.event.inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Set pending statuses
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          post() {
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="pending" \
              -f target_url="${RUN_URL}" \
              -f description="running on public-builder" \
              -f context="$1" >/dev/null
          }
          post "visual-lint (mail-box)"
          post "visual-lint (password-vault)"
          post "visual-lint (eye-care)"
          post "visual-lint (footprint)"
          post "visual-lint (yaoxiaobai)"
          post "visual-lint (daymica)"
          post "visual-lint (water-tracker)"
          post "golden-tests (shared_package)"

      - name: Post failure when resolve fails
        if: failure()
        env:
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          RAW_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha=$(printf '%s' "${RESOLVED_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=$(printf '%s' "${RAW_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "no allowlisted sha; dispatcher pending left in place"
            exit 0
          fi
          for ctx in \
            "visual-lint (mail-box)" \
            "visual-lint (password-vault)" \
            "visual-lint (eye-care)" \
            "visual-lint (footprint)" \
            "visual-lint (yaoxiaobai)" \
            "visual-lint (daymica)" \
            "visual-lint (water-tracker)" \
            "golden-tests (shared_package)"
          do
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${sha}" \
              -f state="failure" \
              -f target_url="${RUN_URL}" \
              -f description="payload rejected" \
              -f context="${ctx}" >/dev/null
          done

  lint:
    name: visual-lint (${{ matrix.app }})
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - mail-box
          - password-vault
          - eye-care
          - footprint
          - yaoxiaobai
          - daymica
          - water-tracker
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: visual_lint
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          case "$APP" in
            mail-box) dir=apps/mail-box ;;
            password-vault) dir=apps/password-vault ;;
            eye-care) dir=apps/eye-care ;;
            footprint) dir=apps/footprint ;;
            yaoxiaobai) dir=apps/yaoxiaobai/yaoxiaobai_app ;;
            daymica) dir=apps/daymica ;;
            water-tracker) dir=apps/water-tracker ;;
            *) echo "ERROR: app not allowlisted" >&2; exit 1 ;;
          esac
          if [ ! -f "${dir}/pubspec.yaml" ]; then
            echo "ERROR: missing ${dir}/pubspec.yaml" >&2
            exit 1
          fi
          cd "${dir}"
          flutter pub get
          if grep -q 'visual_lint' pubspec.yaml; then
            dart run custom_lint
          else
            echo "no visual_lint dependency; checking lib/*.dart and pubspec.yaml"
            if [ ! -d lib ]; then
              echo "ERROR: missing ${dir}/lib" >&2
              exit 1
            fi
            hit=0
            if grep -R -n --include='*.dart' 'package:shadcn_ui' lib; then
              echo "ERROR: code hit: package:shadcn_ui import in lib/*.dart" >&2
              hit=1
            fi
            pubspec_hits=$(awk '
              /^[^[:space:]#]/ { sec=$1; sub(/:.*/, "", sec); next }
              /^[[:space:]]*#/ { next }
              (sec=="dependencies" || sec=="dev_dependencies") && /^[[:space:]]*shadcn_ui:/ {
                printf "pubspec.yaml:%d:%s\n", NR, $0
              }
            ' pubspec.yaml)
            if [ -n "$pubspec_hits" ]; then
              printf '%s\n' "$pubspec_hits"
              echo "ERROR: pubspec hit: shadcn_ui: key in dependencies or dev_dependencies" >&2
              hit=1
            fi
            if [ "$hit" -ne 0 ]; then
              exit 1
            fi
          fi

  golden:
    name: golden-tests (shared_package)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: golden tests
        run: |
          set -euo pipefail
          cd apps/shared_package
          flutter pub get
          mapfile -t files < <(grep -R -l -E 'matchesGoldenFile|testGoldens|goldenFileComparator' test --include='*_test.dart' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no golden tests under apps/shared_package/test" >&2
            exit 1
          fi
          printf 'golden: %s\n' "${files[@]}"
          flutter test "${files[@]}"

  report:
    name: post-statuses
    needs: [meta, lint, golden]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post conclusions
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          ACTIONS_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          declare -A conc=()
          contexts=(
            "visual-lint (mail-box)"
            "visual-lint (password-vault)"
            "visual-lint (eye-care)"
            "visual-lint (footprint)"
            "visual-lint (yaoxiaobai)"
            "visual-lint (daymica)"
            "visual-lint (water-tracker)"
            "golden-tests (shared_package)"
          )
          for attempt in 1 2 3 4 5 6; do
            conc=()
            while IFS=$'\t' read -r name conclusion; do
              [ -n "$name" ] || continue
              conc["$name"]=$conclusion
            done < <(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | [.name, (.conclusion // "")] | @tsv')
            missing=0
            for ctx in "${contexts[@]}"; do
              if [ -z "${conc[$ctx]:-}" ]; then
                missing=1
                echo "waiting for ${ctx} (attempt ${attempt})"
              fi
            done
            if [ "$missing" -eq 0 ]; then
              break
            fi
            sleep 5
          done
          for name in "${!conc[@]}"; do
            echo "job ${name} => ${conc[$name]}"
          done
          post() {
            local ctx="$1" conclusion="${2:-}" state desc
            case "$conclusion" in
              success) state=success; desc=success ;;
              cancelled) state=failure; desc=cancelled ;;
              *) state=failure; desc=failure ;;
            esac
            echo "status ${ctx} ${state}"
            GH_TOKEN="$STATUS_TOKEN" gh api --method POST \
              "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="$state" \
              -f target_url="${RUN_URL}" \
              -f description="$desc" \
              -f context="$ctx" >/dev/null
          }
          for ctx in "${contexts[@]}"; do
            post "$ctx" "${conc[$ctx]:-}"
          done
