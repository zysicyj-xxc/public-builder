# Web visual gate for zysicyj-xxc/zysicyj (ADR 0006).
# Trust boundary: repository_dispatch client_payload and workflow_dispatch inputs are untrusted.
# Allowlist ref/sha before any API call. Status posts run in a separate job so
# PRIVATE_REPO_ACCESS_TOKEN is not on the runner that executes private-repo code.
#
# Contexts are exactly: tokens, web-shared, website.
# tokens: flutter test apps/shared_package/test/tokens/web_token_export_test.dart
#   (writes via export_web_tokens.dart; bare dart run crashes on dart:ui), then
#   git diff --exit-code on the canonical outputs.
# web-shared: pnpm test in apps/web_shared (root workspace if that is where the lockfile is).
# website: pnpm test + pnpm run lint:visual (the pre-deploy gate).
# Flutter version from the private repo .flutter-version, Node 22, same as the other public-builder workflows.

name: Web Visual

on:
  repository_dispatch:
    types: [web-visual]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or SHA of zysicyj-xxc/zysicyj'
        required: true
        type: string
      sha:
        description: 'Commit SHA for checkout and status (default: resolve ref)'
        required: false
        type: string
      scopes:
        description: 'Comma list: tokens,web-shared,website. Empty runs all.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: web-visual-${{ github.event.client_payload.sha || github.event.inputs.sha || github.event.client_payload.ref || github.event.inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: resolve-payload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      scopes: ${{ steps.pick.outputs.scopes }}
    steps:
      - name: Checkout public-builder
        uses: actions/checkout@v4

      - name: Allowlist ref/sha
        id: resolve
        uses: ./.github/actions/resolve-private-ref
        with:
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
          sha: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Pick scopes
        id: pick
        env:
          RAW: ${{ github.event.client_payload.scopes || github.event.inputs.scopes }}
        run: |
          set -euo pipefail
          python3 - "$RAW" <<'PY'
          import os, sys
          order = ["tokens", "web-shared", "website"]
          raw = (sys.argv[1] or "").replace(" ", "")
          if raw == "":
              scopes = order
          else:
              scopes = []
              for part in raw.split(","):
                  if not part:
                      continue
                  if part not in order:
                      sys.exit("FAIL scopes")
                  if part not in scopes:
                      scopes.append(part)
              if not scopes:
                  sys.exit("FAIL scopes")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("scopes= " + " ".join(scopes) + " \n")
          print("PASS scopes count=" + str(len(scopes)))
          PY

      - name: Set pending statuses
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          SCOPES: ${{ steps.pick.outputs.scopes }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "FAIL sha" >&2
            exit 1
          fi
          for scope in ${SCOPES}; do
            case "$scope" in
              tokens|web-shared|website) ;;
              *) echo "FAIL scopes" >&2; exit 1 ;;
            esac
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="pending" \
              -f target_url="${RUN_URL}" \
              -f description="running" \
              -f context="$scope" >/dev/null
          done
          echo "PASS pending"

      - name: Post failure when resolve fails
        if: failure()
        env:
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          RAW_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha=$(printf '%s' "${RESOLVED_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=$(printf '%s' "${RAW_SHA:-}" | tr 'A-F' 'a-f' | tr -d '[:space:]')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "no allowlisted sha; dispatcher pending left in place"
            exit 0
          fi
          for ctx in tokens web-shared website; do
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${sha}" \
              -f state="failure" \
              -f target_url="${RUN_URL}" \
              -f description="payload rejected" \
              -f context="${ctx}" >/dev/null
          done

  tokens:
    name: tokens
    needs: meta
    if: contains(needs.meta.outputs.scopes, ' tokens ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read Flutter version
        id: flutter
        run: |
          set -euo pipefail
          if [ ! -f .flutter-version ]; then
            echo "ERROR: missing .flutter-version" >&2
            exit 1
          fi
          ver=$(tr -d '[:space:]' < .flutter-version)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: .flutter-version is not X.Y.Z" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "flutter-version=$ver"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: 'stable'
          cache: true
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-tokens-${{ hashFiles('apps/shared_package/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-tokens-
      - name: export tokens and diff
        env:
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: tokens
          QUIET_KIND: generic
          QUIET_CMD: |
            set -euo pipefail
            cd apps/shared_package
            flutter pub get
            flutter test --concurrency=2 --reporter json test/tokens/web_token_export_test.dart
            cd ../..
            git diff --exit-code -- apps/shared_package/generated backend/internal/handler/oauth_tokens.css
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-tokens
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  web-shared:
    name: web-shared
    needs: meta
    if: contains(needs.meta.outputs.scopes, ' web-shared ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - name: test web-shared
        env:
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: web-shared
          QUIET_KIND: generic
          QUIET_CMD: |
            set -euo pipefail
            test -f apps/web_shared/package.json
            corepack enable
            if [ -f apps/web_shared/pnpm-lock.yaml ]; then
              cd apps/web_shared
              pnpm install --frozen-lockfile
              pnpm test
            elif [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
              pnpm --dir apps/web_shared test
            else
              exit 1
            fi
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-web-shared
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  website:
    name: website
    needs: meta
    if: contains(needs.meta.outputs.scopes, ' website ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zysicyj-xxc/zysicyj
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          path: _pb
          persist-credentials: false
          fetch-depth: 1
      - name: test and lint:visual
        env:
          GATE_LOG_KEY: ${{ secrets.GATE_LOG_KEY }}
          QUIET_LABEL: website
          QUIET_KIND: generic
          QUIET_CMD: |
            set -euo pipefail
            cd website
            test -f pnpm-lock.yaml
            corepack enable
            pnpm install --frozen-lockfile
            node -e 'const s=require("./package.json").scripts||{}; if(!s["lint:visual"]) process.exit(1)'
            pnpm test
            pnpm run lint:visual
        run: bash "$GITHUB_WORKSPACE/_pb/.github/scripts/quiet.sh"
      - name: Upload encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-${{ github.run_id }}-website-visual
          path: ${{ runner.temp }}/gate-encrypted
          retention-days: 1
          if-no-files-found: ignore

  report:
    name: post-statuses
    needs: [meta, tokens, web-shared, website]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post conclusions
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          TOKENS: ${{ needs.tokens.result }}
          WEB_SHARED: ${{ needs['web-shared'].result }}
          WEBSITE: ${{ needs.website.result }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha failed allowlist" >&2
            exit 1
          fi
          post() {
            local ctx="$1" result="$2" state desc
            if [ "$result" = "skipped" ]; then
              return 0
            fi
            case "$result" in
              success) state=success; desc=success ;;
              cancelled) state=failure; desc=cancelled ;;
              *) state=failure; desc=failure ;;
            esac
            echo "status ${state}"
            gh api --method POST "repos/zysicyj-xxc/zysicyj/statuses/${SHA}" \
              -f state="$state" \
              -f target_url="${RUN_URL}" \
              -f description="$desc" \
              -f context="$ctx" >/dev/null
          }
          post tokens "$TOKENS"
          post web-shared "$WEB_SHARED"
          post website "$WEBSITE"

  purge-logs:
    name: schedule-log-purge
    needs: [meta, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Request log purge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: bash .github/scripts/request-purge.sh || echo "FAIL purge-request"
